# External upstream Playwright compatibility coverage (OPE-113).
#
# SPEEDBAY org-owned file — upstream does not own it (new file in an
# upstream-owned directory, permitted by FORK.md § File placement rule).
# This suite exercises Slack compatibility outside Speed Bay's supported
# operating channels. It is deliberately separate from production auth checks.

name: Upstream Playwright Compatibility

permissions:
  contents: read

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/e2e/**"
      - ".github/workflows/speedbay-playwright-compatibility.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Restore built dashboard
        uses: actions/cache@v4
        with:
          path: ui/.output
          key: playwright-ui-${{ runner.os }}-node22-${{ hashFiles('ui/package.json', 'ui/pnpm-lock.yaml', 'ui/vite.config.ts', 'ui/src/**', 'ui/public/**', 'tests/e2e/global-setup.ts') }}
      - name: Install Python deps (langgraph dev runtime)
        run: uv sync --locked
      - name: Install Playwright + Chromium
        working-directory: tests/e2e
        run: |
          npm ci
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: tests/e2e
        run: npx playwright test --fail-on-flaky-tests
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
