# Speed Bay dashboard unit CI (OPE-99, OPE-113).
#
# SPEEDBAY org-owned file — upstream does not own it (new file in an
# upstream-owned directory, permitted by FORK.md § File placement rule).
#
# Upstream's disabled "Agent CI" includes broader coverage, but re-enabling its
# full matrix would add unrelated cost and noise. This focused dashboard check is
# evidence when present, not a ruleset requirement: making this path-filtered
# workflow required would deadlock PRs whose paths do not trigger it.

name: Speedbay Dashboard

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "agent/**"
      - "agent/dashboard/**"
      - "tests/dashboard/**"
      - "ui/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/speedbay-dashboard-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-unit:
    name: Dashboard unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run dashboard unit tests
        run: uv run pytest -vvv tests/dashboard
